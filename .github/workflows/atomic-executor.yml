name: Atomic executor

on:
  pull_request:
    paths:
      - "app/api/chat/**"
      - "lib/atomic-executor*.ts"
      - "lib/models.ts"
      - "lib/ai.ts"
      - "scripts/run-atomic-executor-integration.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/atomic-executor.yml"
  push:
    branches: [main]
    paths:
      - "app/api/chat/**"
      - "lib/atomic-executor*.ts"
      - "lib/models.ts"
      - "lib/ai.ts"
      - "scripts/run-atomic-executor-integration.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/atomic-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm atomic:contract
      - run: pnpm atomic:integration
