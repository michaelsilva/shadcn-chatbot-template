name: Conversation schema

on:
  pull_request:
    paths:
      - "lib/conversation*.ts"
      - "components/conversation-part.tsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/conversation-schema.yml"
  push:
    branches: [main]
    paths:
      - "lib/conversation*.ts"
      - "components/conversation-part.tsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/conversation-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm conversation:contract
